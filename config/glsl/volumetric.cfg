volopt = [ >= (strstr $volumetrictype $arg1) 0 ]

volumetricvariantshader = [
    local volumetrictype
    volumetrictype = $arg3
    maxsteps = $arg4
    spotlight = (>= $arg2 2)
    colorshadow = (>= (mod (+ $arg2 1) 3) 2)
    variantshader 0 $arg1 $arg2 (? (< $arg2 0) [
        attribute vec4 vvertex;
        uniform mat4 lightmatrix;
        void main(void)
        {
            gl_Position = lightmatrix * vvertex;
        }
    ]) [
        @(gfetchdefs tex3)
        @(if (volopt "p") [
            if (|| (volopt "g") (volopt "G")) [if (> $usetexgather 1) [result [
                uniform sampler2DShadow tex4;
            ]] [result [
                uniform sampler2D tex4;
            ]]] [result [
                uniform sampler2DRectShadow tex4;
            ]]
        ])
        @(if $colorshadow [result [
            uniform sampler2DRect tex11;
            #define filtercolorshadow(tc) texture2DRect(tex11, tc.xy @(? (! (volopt "N")) [* 0.5])).rgb
            #define lightshadowtype vec3
        ]] [result [
            #define lightshadowtype float
        ]])
        uniform vec4 lightpos;
        uniform vec3 lightcolor; 
        @(? $spotlight [
            uniform vec4 spotparams;
        ])
        @(? (volopt "p") [
            uniform vec4 shadowparams;
            uniform vec2 shadowoffset;
        ])
        uniform vec3 camera;
        uniform mat4 worldmatrix;
        uniform vec4 fogdir;
        uniform vec3 fogcolor;
        uniform vec2 fogdensity;
        uniform vec4 radialfogscale;
        uniform vec2 shadowatlasscale;
        uniform vec4 volscale;
        uniform float volminstep;
        uniform float voldistclamp;
        uniform float volprefilter;
        fragdata(0) vec4 fragcolor;

        @(if (volopt "p") [
            ? $spotlight [
                vec3 getspottc(vec3 dir, float spotdist)
                {
                    vec2 mparams = shadowparams.xy / max(spotdist, 1e-5);
                    return vec3((dir.xy - spotparams.xy*(spotdist + (spotparams.z < 0.0 ? -1.0 : 1.0)*dir.z)*shadowparams.z) * mparams.x + shadowoffset, mparams.y + shadowparams.w);
                }
            ] [
                vec3 getshadowtc(vec3 dir)
                {
                    vec3 adir = abs(dir);
                    float m = max(adir.x, adir.y), mz = max(adir.z, m);
                    vec2 mparams = shadowparams.xy / max(mz, 1e-5);
                    vec4 proj;
                    if(adir.x > adir.y) proj = vec4(dir.zyx, 0.0); else proj = vec4(dir.xzy, 1.0);
                    if(adir.z > m) proj = vec4(dir, 2.0);
                    return vec3(proj.xy * mparams.x + vec2(proj.w, step(proj.z, 0.0)) * shadowparams.z + shadowoffset, mparams.y + shadowparams.w);
                }
            ]
        ])

        @(if (volopt "p") [
            if (|| (volopt "g") (volopt "G")) [
                ? (> $usetexgather 1) [
                    #define filtershadow(shadowtc) float(shadow2D(tex4, vec3(shadowtc.xy*shadowatlasscale, shadowtc.z)))
                ] [
                    #define filtershadow(shadowtc) step(shadowtc.z, float(texture2D(tex4, shadowtc.xy*shadowatlasscale)))
                ]
            ] [result [
                #define filtershadow(shadowtc) float(shadow2DRect(tex4, shadowtc))
            ]]
        ])
    
        void main(void)
        {
            vec2 tc = gl_FragCoord.xy * volscale.xy;
            @(gdepthunpack depth [gfetch(tex3, tc)] [
                vec3 pos = (worldmatrix * vec4(depth*tc, depth, 1.0)).xyz;
            ] [
                vec4 pos = worldmatrix * vec4(tc, depth, 1.0);
                pos.xyz /= pos.w;
            ])
            vec3 ray = pos.xyz - camera;
            float dist2 = dot(ray, ray), invdist = inversesqrt(dist2), radialdist = min(dist2 * invdist, voldistclamp);
            ray *= invdist;
            vec3 camlight = lightpos.xyz - camera * lightpos.w;
            float camlight2 = dot(camlight, camlight), v = dot(camlight, ray), d = v*v + 1.0 - camlight2;
            lightshadowtype light = lightshadowtype(0.0);
            if(d > 0)
            {
                d = sqrt(d);
                float front = v - d, back = v + d;
                @(? $spotlight [
                    float spotangle = 1.0 - 1.0/spotparams.w, spotangle2 = spotangle*spotangle,
                          rayspot = dot(ray, spotparams.xyz), camspot = dot(camlight, spotparams.xyz),
                          qa = spotangle2 - rayspot*rayspot,
                          qb = rayspot*camspot - spotangle2*v,
                          qc = spotangle2*camlight2 - camspot*camspot,
                          disc = qb*qb - qa*qc;
                    if(disc > 0)
                    {
                        disc = abs(sqrt(disc)/qa);
                        float t = -qb/qa, t0 = t - disc, t1 = t + disc;
                        if(t0*rayspot < camspot) front = max(front, t1);
                        else if(t1*rayspot < camspot) back = min(back, t0);
                        else { front = max(front, t0); back = min(back, t1); }
                ])
                float maxspace = back - front, stepdist = maxspace * @(divf 1.0 $maxsteps);
                front = max(front, 0.0);
                back = min(back, radialdist * lightpos.w);
                float space = back - front;
                if(space > volminstep*stepdist)
                {
                    float dither = dot(fract((gl_FragCoord.xy - 0.5).xyxy*vec4(0.5, 0.5, 0.25, 0.25)), vec4(0.375, 0.9375, 0.25, 0.125));
                    vec3 lightdir = ray * (back + stepdist*dither) - camlight;
                    vec3 raystep = ray * -stepdist;
                    for(int i = 0; i < @maxsteps; i++)
                    {
                        lightdir += raystep;
                        @(if $spotlight [result [
                            float lightdist2 = dot(lightdir, lightdir);
                            float lightinvdist = inversesqrt(lightdist2); 
                            float spotdist = dot(lightdir, spotparams.xyz);
                            float spotatten = 1.0 - (1.0 - lightinvdist * spotdist) * spotparams.w;
                            if(spotatten > 0.0)
                            {
                                float lightatten = clamp(1.0 - lightdist2 * lightinvdist, 0.0, 1.0) * spotatten;
                                @(? (volopt "p") [
                                    vec3 spottc = getspottc(lightdir, spotdist);
                                    lightatten *= filtershadow(spottc);
                                ])
                                light += lightatten @(? $colorshadow [* filtercolorshadow(spottc)]);
                            }
                        ]] [result [
                            float lightatten = clamp(1.0 - length(lightdir), 0.0, 1.0);
                            @(? (volopt "p") [
                                vec3 shadowtc = getshadowtc(lightdir);
                                lightatten *= filtershadow(shadowtc);
                            ])
                            light += lightatten @(? $colorshadow [* filtercolorshadow(shadowtc)]);
                        ]])
                        space -= stepdist;
                        if(space <= 0) break; 
                    }
                    float fogcoord = front/lightpos.w;
                    float foglerp = clamp(exp2(fogcoord*fogdensity.x)*fogdensity.y, 0.0, 1.0);
                    light *= foglerp * stepdist;
                    @(? $spotlight [
                        light /= min(maxspace, 1.0);
                    ])
                }
                @(? $spotlight [}])
            }
            vec2 weights = step(fwidth(radialdist), volprefilter) * (2.0*fract((gl_FragCoord.xy - 0.5)*0.5) - 0.5);
            light -= dFdx(light) * weights.x;
            light -= dFdy(light) * weights.y;
            fragcolor.rgb = light * lightcolor;
            fragcolor.a = 0.0;
        }
    ]
]

volumetricshader = [
    volumetrictype = (concatword $arg1 $arg2)
    shadername = (concatword "volumetric" $volumetrictype $arg3)
    volumetricvariantshader $shadername -1 $arg1 $arg3
    volumetricvariantshader $shadername 0 (concatword $arg1 $arg2) $arg3
    if (volopt "P") [
      volumetricvariantshader $shadername 1 (concatword $arg1 $arg2) $arg3
    ]
    if (volopt "s") [
        volumetricvariantshader $shadername 2 $arg1 $arg3
        volumetricvariantshader $shadername 3 (concatword $arg1 $arg2) $arg3    
        if (volopt "P") [
            volumetricvariantshader $shadername 4 (concatword $arg1 $arg2) $arg3
        ]
    ]
]

godRayOpt = [ >= (strstr $godRayType $arg1) 0 ]

godRaysVariantShader = [
    local godRayType
    godRayType = $arg2
    numSplits = $arg3
    maxSteps = $arg4
    shader 0 $arg1 [
        attribute vec4 vvertex;
        void main(void)
        {
            gl_Position = vvertex;
        }
    ] [
        @(gfetchdefs tex3 (godRayOpt "m"))
        @(if (|| (godRayOpt "g") (godRayOpt "G")) [if (> $usetexgather 1) [result [
            uniform sampler2DShadow tex4;
        ]] [result [
            uniform sampler2D tex4;
        ]]] [result [
            uniform sampler2DRectShadow tex4;
        ]])
        uniform vec4 csmtc[@@numSplits];
        uniform vec3 csmoffset[@@numSplits];
        uniform vec2 csmz;
        uniform mat3 csmmatrix;
        uniform vec3 sunlightdir;
        uniform vec3 camera;
        uniform mat4 worldmatrix;
        uniform vec2 shadowatlasscale;
        uniform vec4 godRayScreen;
        uniform vec4 godRayParams;
        uniform float godRaySkyMax;
        uniform vec3 godRayColor;
        fragdata(0) vec4 fragcolor;

        @(cond [godRayOpt "G"] [
            smfilterg5 0
        ] [godRayOpt "g"] [
            smfilterg3 0
        ] [godRayOpt "E"] [
            smfilterb5 0
        ] [godRayOpt "F"] [
            smfilterb3 0
        ] [godRayOpt "f"] [
            smfilterrg 0
        ] [
            smfilternone 0
        ])

        vec3 getCsmTc(vec3 worldPos)
        {
            vec3 tc;
            worldPos = csmmatrix * worldPos;
            tc.z = csmz.x + worldPos.z*csmz.y;
            @(loopconcat j $numSplits [result [
                tc.xy = csmtc[@@j].xy + worldPos.xy*csmtc[@@j].z;
                if(max(abs(tc.x), abs(tc.y)) < csmtc[@@j].w) return tc + csmoffset[@@j];
            ]])
            return vec3(-16384.0);
        }

        float sampleSunlight(vec3 worldPos)
        {
            vec3 shadowtc = getCsmTc(worldPos);
            if(shadowtc.x < -8192.0 || shadowtc.z <= 0.0 || shadowtc.z >= 1.0) return 0.0;
            return filtershadow(shadowtc);
        }

        void main(void)
        {
            // gl_FragCoord is already pixel-centered for this rect target.
            vec2 lowPix  = gl_FragCoord.xy;
            vec2 depthTc = lowPix * godRayScreen.xy;
            vec4 rawDepth = gfetch(tex3, depthTc);
            bool skyPixel = false;
            @(? $gdepthformat [
                skyPixel = rawDepth.r <= 1.0e-6;
            ] [
                skyPixel = rawDepth.r >= 0.999999;
            ])
            @(gdepthunpack depth [rawDepth] [
                vec3 worldPos = (worldmatrix * vec4(depth*depthTc, depth, 1.0)).xyz;
            ] [
                vec4 worldPos4 = worldmatrix * vec4(depthTc, depth, 1.0);
                vec3 worldPos = worldPos4.xyz/worldPos4.w;
            ])
            @(? $gdepthformat [
                skyPixel = skyPixel || depth <= 0.0;
            ])
            if(skyPixel)
            {
                float skyDepth = godRayParams.x;
                @(? $gdepthformat [
                    worldPos = (worldmatrix * vec4(skyDepth*depthTc, skyDepth, 1.0)).xyz;
                ] [
                    vec4 skyPos4 = worldmatrix * vec4(depthTc, 1.0, 1.0);
                    vec3 skyDir = skyPos4.xyz/skyPos4.w - camera;
                    float skyDirLen = max(length(skyDir), 1.0e-3);
                    worldPos = camera + skyDir * (skyDepth / skyDirLen);
                ])
            }
            vec3 rayVector = worldPos - camera;
            float rayLength = min(length(rayVector), godRayParams.x);
            if(rayLength <= 1e-3)
            {
                fragcolor = vec4(0.0);
                return;
            }

            vec3 rayDir = rayVector / rayLength;
            float viewSun = clamp(dot(rayDir, sunlightdir), 0.0, 1.0);
            float phase = mix(0.15, 1.0, viewSun*viewSun);
            float stepLength = rayLength * godRayParams.y;
            float noise = fract(52.9829189f * fract(dot(gl_FragCoord.xy, vec2(0.06711056f, 0.00583715f))));
            float current = stepLength * (0.5 + noise);
            float accumulation = 0.0;
            vec3 samplePos = camera + rayDir*current;
            for(int i = 0; i < @maxSteps; i++)
            {
                if(current >= rayLength) break;
                float attenuation = 1.0 - current/max(rayLength, 1e-3);
                accumulation += sampleSunlight(samplePos) * attenuation;
                samplePos += rayDir * stepLength;
                current += stepLength;
            }

            float intensity = accumulation * stepLength * godRayParams.z * phase;
            float maxAmount = max(godRayParams.w, 1.0e-4);
            if(skyPixel)
            {
                float skyMaxAmount = max(godRaySkyMax, 0.0);
                if(skyMaxAmount <= 1.0e-6) intensity = 0.0;
                else maxAmount = max(skyMaxAmount, 1.0e-4);
            }
            intensity = maxAmount * (1.0 - exp2(-intensity/maxAmount));
            fragcolor = vec4(godRayColor * intensity, 0.0);
        }
    ]
]

godraysshader = [
    godRayType = $arg1
    numSplits = $arg2
    maxSteps = $arg3
    godRaysVariantShader (format "godrays%1%2%3" $godRayType $numSplits $maxSteps) $godRayType $numSplits $maxSteps
]

godRaysBilateralVariantShader = [
    msDepth = $arg2
    numTaps = $arg3
    filterDir = $arg4
    shader 0 $arg1 [
        attribute vec4 vvertex;
        void main(void)
        {
            gl_Position = vvertex;
        }
    ] [
        uniform sampler2DRect tex0;
        @(gfetchdefs tex1 $msDepth depthfetch)
        @(gdepthunpackparams)
        uniform vec4 godRayScreen;
        uniform float godRayBilateralSigma;
        fragdata(0) vec4 fragcolor;

        float fetchLinearDepth(vec2 tc)
        {
            vec4 rawDepth = depthfetch(tex1, tc);
            @(? $gdepthformat [
                if(rawDepth.r <= 1.0e-6) return 1.0e16;
            ] [
                if(rawDepth.r >= 0.999999) return 1.0e16;
            ])
            @(gdepthunpack depth [rawDepth])
            return depth;
        }

        void main(void)
        {
            vec2 lowTc = gl_FragCoord.xy;
            vec2 fullCenterTc = lowTc * godRayScreen.xy;
            float centerDepth = fetchLinearDepth(fullCenterTc);
            float centerScale = max(centerDepth, 1.0);

            float sigma = max(godRayBilateralSigma, 1.0e-4);

            vec3 color = texture2DRect(tex0, lowTc).rgb;
            float totalWeight = 1.0;

            @(loopconcat i (* 2 $numTaps) [
                curtap = (- $i $numTaps)
                if (>= $curtap 0) [curtap = (+ $curtap 1)]
                result [
                    vec2 tapOffset@[i] = @(? (=s $filterDir "x") [vec2(@(+f $curtap), 0.0)] [vec2(0.0, @(+f $curtap))]);
                    vec2 tapLowTc@[i] = lowTc + tapOffset@[i];
                    vec3 tapColor@[i] = texture2DRect(tex0, tapLowTc@[i]).rgb;
                    vec2 tapFullTc@[i] = (tapLowTc@[i]) * godRayScreen.xy;
                    float tapDepth@[i] = fetchLinearDepth(tapFullTc@[i]);
                    float depthDelta@[i] = (tapDepth@[i] - centerDepth) / centerScale;
                    float weight@[i] = exp2(@(-f 0 (* $curtap $curtap)) - abs(depthDelta@[i]) * sigma);
                    totalWeight += weight@[i];
                    color += tapColor@[i] * weight@[i];
                ]
            ])

            fragcolor = vec4(color/max(totalWeight, 1.0e-6), 0.0);
        }
    ]
]

godraysbilateralshader = [
    msDepth = $arg1
    numTaps = $arg2
    pass = $arg3
    if $pass [
        godRaysBilateralVariantShader (format "godraysbilateraly%1%2" $msDepth $numTaps) $msDepth $numTaps y
    ] [
        godRaysBilateralVariantShader (format "godraysbilateralx%1%2" $msDepth $numTaps) $msDepth $numTaps x
    ]
]

godRaysUpsampleVariantShader = [
    msDepth = $arg2
    shader 0 $arg1 [
        attribute vec4 vvertex;
        void main(void)
        {
            gl_Position = vvertex;
        }
    ] [
        uniform sampler2DRect tex0;                         // low-res godrays buffer
        @(gfetchdefs tex1 $msDepth depthfetch)
        @(gdepthunpackparams)
        uniform vec4 godRayScreen;                           // xy=full/low, zw=low/full
        uniform vec2 godRayUpsampleParams;                   // x=sigma, y=blurBlend
        fragdata(0) vec4 fragcolor;

        float fetchLinearDepth(vec2 tc)
        {
            vec4 rawDepth = depthfetch(tex1, tc);
            @(? $gdepthformat [
                if(rawDepth.r <= 1.0e-6) return 1.0e16;
            ] [
                if(rawDepth.r >= 0.999999) return 1.0e16;
            ])
            @(gdepthunpack depth [rawDepth])
            return depth;
        }
        
        void main(void)
        {
            vec2 fullTc = gl_FragCoord.xy;
            vec2 lowCoord = fullTc * godRayScreen.zw;   // zw = low/full
            vec2 base = floor(lowCoord - vec2(0.5));
            vec2 f    = fract(lowCoord - vec2(0.5));

            float centerDepth = fetchLinearDepth(fullTc);

            vec2 tc00 = base + vec2(0.5, 0.5);
            vec2 tc10 = base + vec2(1.5, 0.5);
            vec2 tc01 = base + vec2(0.5, 1.5);
            vec2 tc11 = base + vec2(1.5, 1.5);

            vec3 c00 = texture2DRect(tex0, tc00).rgb;
            vec3 c10 = texture2DRect(tex0, tc10).rgb;
            vec3 c01 = texture2DRect(tex0, tc01).rgb;
            vec3 c11 = texture2DRect(tex0, tc11).rgb;
            vec3 linearFiltered = mix(mix(c00, c10, f.x), mix(c01, c11, f.x), f.y);

            vec2 full00 = tc00 * godRayScreen.xy;
            vec2 full10 = tc10 * godRayScreen.xy;
            vec2 full01 = tc01 * godRayScreen.xy;
            vec2 full11 = tc11 * godRayScreen.xy;

            float d00 = fetchLinearDepth(full00);
            float d10 = fetchLinearDepth(full10);
            float d01 = fetchLinearDepth(full01);
            float d11 = fetchLinearDepth(full11);

            float w00 = (1.0 - f.x) * (1.0 - f.y);
            float w10 = (f.x)       * (1.0 - f.y);
            float w01 = (1.0 - f.x) * (f.y);
            float w11 = (f.x)       * (f.y);

            float sigma = max(godRayUpsampleParams.x, 1e-4);

            float depthScale = max(centerDepth, 1.0);
            float dz00 = (d00 - centerDepth)/depthScale;
            float dz10 = (d10 - centerDepth)/depthScale;
            float dz01 = (d01 - centerDepth)/depthScale;
            float dz11 = (d11 - centerDepth)/depthScale;

            float wd00 = exp2(-abs(dz00) * sigma);
            float wd10 = exp2(-abs(dz10) * sigma);
            float wd01 = exp2(-abs(dz01) * sigma);
            float wd11 = exp2(-abs(dz11) * sigma);

            w00 *= wd00;
            w10 *= wd10;
            w01 *= wd01;
            w11 *= wd11;

            float ws = max(w00 + w10 + w01 + w11, 1.0e-6);
            vec3 filtered = (c00*w00 + c10*w10 + c01*w01 + c11*w11) / ws;
            
            if(ws < 0.01)
            {
                filtered = c00;
                float bestDepthDelta = abs(dz00);
                float testDepthDelta = abs(dz10);
                if(testDepthDelta < bestDepthDelta) { bestDepthDelta = testDepthDelta; filtered = c10; }
                testDepthDelta = abs(dz01);
                if(testDepthDelta < bestDepthDelta) { bestDepthDelta = testDepthDelta; filtered = c01; }
                testDepthDelta = abs(dz11);
                if(testDepthDelta < bestDepthDelta) filtered = c11;
            }
            
            float blurBlend = clamp(godRayUpsampleParams.y, 0.0, 1.0);

            // bilateral always handles the edge; blend only controls softness away from edges
            float edgeness = 1.0 - clamp(ws * 4.0, 0.0, 1.0); // 1 = hard edge, 0 = smooth region
            fragcolor = vec4(mix(linearFiltered, filtered, max(1.0 - blurBlend, edgeness)), 0.0);
        }
    ]
]

godraysupsampleshader = [
    godRaysUpsampleVariantShader (format "godraysupsample%1" $arg1) $arg1
]

volumetricbilateralvariantshader = [
    numtaps = $arg2
    reduced = $arg3 
    filterdir = $arg4
    shader 0 $arg1 [
        attribute vec4 vvertex;
        @(if $reduced [result [
            @(screentexcoord 0)
            varying vec2 texcoord0;
        ]])
        void main(void)
        {
            gl_Position = vvertex;
            @(? $reduced [texcoord0 = vtexcoord0;])
        }
    ] [
        @(gfetchdefs tex3)
        uniform sampler2DRect tex0;
        uniform vec2 bilateralparams;
        @(? $reduced [varying vec2 texcoord0;])
        fragdata(0) vec4 fragcolor;
        void main(void)
        {
            #define tc gl_FragCoord.xy
            #define depthtc @(? $reduced [texcoord0] [gl_FragCoord.xy])
            #define tapvec(type, i) @(? (=s $filterdir "x") [type(i, 0.0)] [type(0.0, i)])
            #define texval(i) texture2DRect(tex0, tc + tapvec(vec2, i))
            #define texvaloffset(i) texture2DRectOffset(tex0, tc, tapvec(ivec2, i))
            #define depthval(i) gfetch(tex3, depthtc + tapvec(vec2, i))
            #define depthvaloffset(i) gfetchoffset(tex3, depthtc, tapvec(ivec2, i))
            vec3 color = texture2DRect(tex0, tc).rgb;
            @(gdepthunpack depth [gfetch(tex3, depthtc)])
            float weights = 1.0;
            @(loopconcat i (* 2 $numtaps) [
                curtap = (- $i $numtaps)
                if (>= $curtap 0) [curtap = (+ $curtap 1)]
                curtapoffset = (* $curtap 2)
                curdepthoffset = (<< $curtapoffset $reduced)
                curtexval = [texval@(? (<= $mintexrectoffset $curtapoffset $maxtexrectoffset) "offset")(@(+f $curtapoffset))]
                curdepthval = [depthval@(? (<= $mintexrectoffset $curdepthoffset $maxtexrectoffset) "offset")(@(+f $curdepthoffset))]
                result [
                    vec3 color@[i] = @[curtexval].rgb;
                    @(gdepthunpack [depth@[i]] $curdepthval)
                    depth@[i] -= depth;
                    float weight@[i] = exp2(@(-f 0 (* $curtap $curtap))*bilateralparams.x - depth@[i]*depth@[i]*bilateralparams.y); 
                    weights += weight@[i];
                    color += weight@[i] * color@[i];
                ]
            ])
            fragcolor = vec4(color / weights, 0.0);
        }
    ]
]

volumetricbilateralshader = [
    volumetricbilateralvariantshader (concatword "volumetricbilateralx" $arg1 $arg2) $arg1 $arg2 x
    volumetricbilateralvariantshader (concatword "volumetricbilateraly" $arg1 $arg2) $arg1 $arg2 y
]
